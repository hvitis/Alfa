name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Validate and export showcase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Static ffmpeg/ffprobe from GitHub releases; the Ubuntu apt mirror has stalled installs for 10+ minutes.
      - name: Cache ffmpeg
        uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-${{ runner.os }}-master-lgpl

      - name: Install dependencies
        run: |
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/.local/ffmpeg
            curl --fail --silent --show-error --location --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz \
              | tar -xJ -f - -C ~/.local/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          ~/.local/ffmpeg/ffprobe -version | head -1
          echo "$HOME/.local/ffmpeg" >> "$GITHUB_PATH"
          python -m pip install -r requirements/dev.txt
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi

      - name: Fast validation and unit tests
        run: make check PYTHON=python

      - name: Export showcase with case renders and downloadables
        run: make site PYTHON=python

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  secrets:
    name: Scan source for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Check repository credentials and public policy
        run: |
          python -m pip install -r requirements/dev.txt
          python scripts/check_repo.py

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [validate-and-export, secrets]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
